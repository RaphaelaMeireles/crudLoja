<div class="page-header">
  <h1>Produtos</h1>
  <a routerLink="/novo" class="btn btn-primary">+ Novo produto</a>
</div>

<div class="search">
  <input
    type="text"
    [(ngModel)]="searchName"
    (input)="load()"
    placeholder="Buscar por nome"
  />
</div>

<ng-container *ngIf="products.length; else empty">
  <table>
    <tr>
      <th>Imagem</th>
      <th>Nome</th>
      <th>Marca</th>
      <th>Valor</th>
      <th>Status</th>
      <th></th>
    </tr>

    <tr *ngFor="let product of products">
      <td>
        <img
          *ngIf="product.imagem_url; else semImagem"
          [src]="imageUrl(product.imagem_url)"
          [alt]="product.nome"
          class="thumb"
        />
        <ng-template #semImagem
          ><div class="thumb thumb-empty">sem foto</div></ng-template
        >
      </td>
      <td>{{ product.nome }}</td>
      <td>{{ product.marca }}</td>
      <td>{{ product.valor | number: "1.2-2" }}</td>
      <td>
        <span
          class="badge"
          [class.badge-on]="product.status"
          [class.badge-off]="!product.status"
        >
          {{ product.status ? "Em estoque" : "Fora de estoque" }}
        </span>
      </td>
      <td>
        <div class="row-actions">
          <a [routerLink]="['/editar', product.id]" class="btn btn-secondary"
            >Editar</a
          >
          <button (click)="remove(product.id!)" class="btn btn-danger">
            Excluir
          </button>
        </div>
      </td>
    </tr>
  </table>
</ng-container>

<ng-template #empty>
  <div class="card empty-state">Nenhum produto encontrado.</div>
</ng-template>
